<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo — KN Center</title>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<style>
  :root {
    --ink: #1d1d1f;
    --muted: #86868b;
    --bg: #fbfbfd;
    --card: #ffffff;
    --linha: #e8e8ed;
    --azul: #0071e3;
    --azul-glow: rgba(0, 113, 227, .18);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  .oculto { display: none !important; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif;
    background:
      radial-gradient(720px 360px at 50% -80px, rgba(0,113,227,.07), transparent 70%),
      var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  @keyframes surgir {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  header {
    text-align: center;
    padding: 56px 20px 30px;
    animation: surgir .6s ease both;
  }
  header img { height: 34px; width: auto; margin-bottom: 18px; }
  header h1 {
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
    background: linear-gradient(90deg, var(--ink) 55%, var(--azul));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header p {
    color: var(--muted);
    font-size: 17px;
    margin: 0;
  }

  .barra {
    max-width: 1100px;
    margin: 0 auto 8px;
    padding: 10px 24px;
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 5;
    background: rgba(251, 251, 253, .72);
    backdrop-filter: saturate(180%) blur(14px);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
  }
  .filtro-pill {
    border: 1px solid var(--linha);
    background: #fff;
    color: var(--ink);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: background .2s ease, color .2s ease, border-color .2s ease, box-shadow .2s ease, transform .15s ease;
  }
  .filtro-pill:hover { background: #f5f5f7; transform: translateY(-1px); }
  .filtro-pill.ativo {
    background: var(--azul);
    color: #fff;
    border-color: var(--azul);
    box-shadow: 0 4px 14px var(--azul-glow);
  }

  .btn-pdf {
    position: fixed;
    top: 20px;
    right: 20px;
    background: var(--azul);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 16px var(--azul-glow);
    z-index: 10;
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .btn-pdf:hover {
    background: #0077ed;
    transform: translateY(-2px);
    box-shadow: 0 8px 22px var(--azul-glow);
  }
  .btn-pdf:active { transform: translateY(0); }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px 100px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 28px;
  }

  .card {
    background: var(--card);
    border-radius: 18px;
    overflow: hidden;
    break-inside: avoid;
    page-break-inside: avoid;
    box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.03);
    transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s cubic-bezier(.2,.8,.2,1);
    animation: surgir .55s cubic-bezier(.2,.8,.2,1) both;
    animation-delay: var(--atraso, 0s);
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 20px 40px rgba(0,0,0,.09), 0 6px 16px var(--azul-glow);
  }
  .foto {
    aspect-ratio: 1 / 1;
    width: 100%;
    background: #f5f5f7;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .foto img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover .foto img { transform: scale(1.07); }
  .foto .sem-foto {
    color: var(--muted);
    font-size: 13px;
  }
  .info { padding: 16px 16px 18px; }
  .categoria {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--azul);
    background: rgba(0, 113, 227, .08);
    padding: 3px 9px;
    border-radius: 6px;
    margin: 0 0 8px;
  }
  .nome {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
    line-height: 1.25;
  }
  .condicao {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .preco {
    font-size: 20px;
    font-weight: 700;
    color: var(--azul);
    margin: 0;
  }
  .preco.consulte { color: var(--muted); font-weight: 500; font-size: 15px; }

  .vazio {
    text-align: center;
    color: var(--muted);
    padding: 80px 20px;
    animation: surgir .5s ease both;
  }

  @media (max-width: 480px) {
    header { padding: 40px 16px 26px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
  }

  @media print {
    .no-print { display: none !important; }
    body { background: #fff; }
    header { padding: 10px 0 24px; animation: none; }
    main { padding: 0 10px 20px; max-width: 100%; }
    .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .card { break-inside: avoid; page-break-inside: avoid; box-shadow: none; animation: none; transform: none; }
    .card:hover { box-shadow: none; transform: none; }
    .foto img { transition: none; }
  }
</style>
</head>
<body>

<button class="btn-pdf no-print" onclick="window.print()">⬇︎ Baixar PDF</button>

<header>
  <img src="/logo.png" alt="KN Center">
  <h1>Catálogo</h1>
  <p>Produtos disponíveis agora</p>
</header>

<div class="barra no-print" id="filtros"></div>

<main>
  <div class="grid" id="grid"></div>
  <div class="vazio oculto" id="vazio">Nenhum produto disponível no momento.</div>
</main>

<script>
  const fmt = (n) => 'R$ ' + Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  let PRODUTOS = [];
  let CATEGORIA_ATIVA = '';

  function renderFiltros() {
    const categorias = [...new Set(PRODUTOS.map(p => p.categoria))].sort();
    const box = document.getElementById('filtros');
    if (categorias.length <= 1) { box.innerHTML = ''; return; }
    box.innerHTML = `<button class="filtro-pill ${CATEGORIA_ATIVA === '' ? 'ativo' : ''}" data-cat="">Tudo</button>` +
      categorias.map(c => `<button class="filtro-pill ${CATEGORIA_ATIVA === c ? 'ativo' : ''}" data-cat="${c}">${c}</button>`).join('');
    box.querySelectorAll('.filtro-pill').forEach(b => b.addEventListener('click', () => {
      CATEGORIA_ATIVA = b.dataset.cat;
      renderFiltros();
      renderGrid();
    }));
  }

  function renderGrid() {
    const lista = CATEGORIA_ATIVA ? PRODUTOS.filter(p => p.categoria === CATEGORIA_ATIVA) : PRODUTOS;
    const grid = document.getElementById('grid');
    document.getElementById('vazio').classList.toggle('oculto', lista.length > 0);
    grid.innerHTML = lista.map((p, i) => `
      <div class="card" style="--atraso:${Math.min(i * 0.05, 0.4)}s">
        <div class="foto">
          ${p.fotos && p.fotos.length ? `<img src="${p.fotos[0]}" loading="lazy" alt="${p.nome}">` : `<span class="sem-foto">Sem foto</span>`}
        </div>
        <div class="info">
          <p class="categoria">${p.categoria || ''}</p>
          <p class="nome">${p.nome}</p>
          ${p.condicao ? `<p class="condicao">${p.condicao}</p>` : ''}
          ${p.preco_anuncio != null ? `<p class="preco">${fmt(p.preco_anuncio)}</p>` : `<p class="preco consulte">Consulte o valor</p>`}
        </div>
      </div>
    `).join('');
  }

  fetch('/publico/catalogo')
    .then(r => r.json())
    .then(r => {
      PRODUTOS = r.data || [];
      renderFiltros();
      renderGrid();
    })
    .catch(() => {
      document.getElementById('vazio').textContent = 'Não deu pra carregar o catálogo agora. Tenta de novo em instantes.';
      document.getElementById('vazio').classList.remove('oculto');
    });
</script>

</body>
</html>
